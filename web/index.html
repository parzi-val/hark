<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Hark</title>
    
    <!-- PWA Primary Tags -->
    <meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#33342F" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- iOS PWA Specific Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hark" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- SEO + link-preview cards (Open Graph / Twitter) -->
    <meta name="description" content="Hark tidies raw spoken thoughts into clean, structured Markdown notes and checklists. Voice-first, offline-ready, and private." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hark" />
    <meta property="og:title" content="Hark — speak your mind, we'll shape the thought" />
    <meta property="og:description" content="Voice-first notes that tidy raw spoken thoughts into clean Markdown and checklists. Offline-ready and private." />
    <meta property="og:url" content="https://hark.krbala.in/" />
    <meta property="og:image" content="https://hark.krbala.in/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hark — voice-first notes" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hark — speak your mind, we'll shape the thought" />
    <meta name="twitter:description" content="Voice-first notes that tidy raw spoken thoughts into clean Markdown and checklists. Offline-ready and private." />
    <meta name="twitter:image" content="https://hark.krbala.in/og.png" />

    <!-- Google Fonts: Libre Baskerville + Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-paper text-ink antialiased select-none selection:bg-rust selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg error:', err));
        });
      }
    </script>
  </body>
</html>
