<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Hark — Widgets-first notes</title>
    
    <!-- PWA Primary Tags -->
    <meta name="theme-color" content="#F4F2ED" media="(prefers-color-scheme: light)" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- iOS PWA Specific Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Google Fonts: Libre Baskerville + Syne Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <body class="bg-paper text-ink antialiased select-none selection:bg-rust selection:text-white">

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg error:', err));
